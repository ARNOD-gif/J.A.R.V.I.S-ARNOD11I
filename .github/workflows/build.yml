name: "Build JARVIS APK"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            git \
            libncursesw5-dev \
            libssl-dev \
            libffi-dev \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            imagemagick

      - name: Install Cython & Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "Cython==0.29.36" "buildozer>=1.5.0" "python-for-android>=2024.1.21"

      - name: Setup Android SDK and Aidl
        run: |
          # 1. Pre-accept SDK licenses directly to disk (No pipes, no 'yes' command)
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n89330d32252cd225f11c5fe196d1112b640a1da9\nd56f5187479451eabf01fb78af6d623503d065a9\n24333f8a63718c309d6314270d1e4f0250b1b2d5" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b94fe1430d0feb6500911a0873887256e35" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\nd9050156456102e513847e2606e872d671276082" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "\n601007b94ed797dd23565d7bd047c8926f799fcd" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"

          # 2. Install required Platform 33 & Build-Tools containing aidl
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-33" "build-tools;33.0.2" "platform-tools" --no_progress

          # 3. Create Buildozer SDK directory structure
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK"

          # 4. Copy system SDK components into Buildozer's folder so aidl is immediately found
          cp -r $ANDROID_HOME/* "$BUILDOZER_SDK/" || true

      - name: Build APK with Buildozer
        env:
          MAKEFLAGS: "-j2"
          _JAVA_OPTIONS: "-Xmx4096m -XX:+UseG1GC"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
