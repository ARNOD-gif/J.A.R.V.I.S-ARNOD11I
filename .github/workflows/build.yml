name: "Build JARVIS APK"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            git \
            libncursesw5-dev \
            libssl-dev \
            libffi-dev \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            imagemagick

      - name: Install Cython & Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "Cython==0.29.36" "buildozer>=1.5.0" "python-for-android>=2024.1.21"

      - name: Pre-accept SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true

      - name: Build APK with Buildozer
        env:
          MAKEFLAGS: "-j2"
          _JAVA_OPTIONS: "-Xmx4096m -XX:+UseG1GC"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
