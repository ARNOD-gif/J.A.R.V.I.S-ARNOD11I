name: Build J.A.R.V.I.S APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Apt Mirror & Install System Dependencies
        run: |
          sudo sed -i 's/http:\/\/azure.archive.ubuntu.com/http:\/\/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo sed -i 's/http:\/\/azure.archive.ubuntu.com/http:\/\/archive.ubuntu.com/g' /etc/apt/sources.list.d/*.list || true
          
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends \
            python3-pip \
            build-essential \
            git \
            ffmpeg \
            libssl-dev \
            libffi-dev \
            libsqlite3-dev \
            liblzma-dev \
            libbz2-dev \
            libreadline-dev \
            libncursesw5-dev \
            tk-dev \
            zlib1g-dev \
            ccache \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            cmake

      - name: Install Cython & Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.33 "buildozer>=1.5.0"

      - name: Pre-configure Android SDK & Symlinks
        run: |
          # Automatically accept all SDK licenses
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

          # Create directory structure expected by Buildozer
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK"

          # Symlink system SDK into Buildozer's directory
          ln -sf $ANDROID_HOME/* "$BUILDOZER_SDK/" || true

          # Create legacy tools symlink required by Buildozer checks
          mkdir -p "$BUILDOZER_SDK/tools/bin"
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$BUILDOZER_SDK/tools/bin/sdkmanager" || true

      - name: Build APK with Buildozer (Memory Throttled)
        env:
          MAKEFLAGS: "-j2"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
