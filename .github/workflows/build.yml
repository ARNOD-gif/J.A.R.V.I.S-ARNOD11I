name: Build J.A.R.V.I.S APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Essential Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache libncursesw5-dev

      - name: Install Cython & Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.33 "buildozer>=1.5.0"

      - name: Setup Android SDK Layout
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"

          # Download official Command Line Tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9441913_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          rm -f /tmp/cmdline-tools.zip

          # Legacy path symlinks expected by Buildozer
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"

          # Pre-accept licenses
          mkdir -p "$SDK_DIR/licenses"
          echo -e "24333f8a637b3702d1927e1501702586f96e3d94\n89330172875f108642f7217869b4e3ce443729b5\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"

          # Install API platform packages
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "platform-tools"

      - name: Build APK with Buildozer
        env:
          MAKEFLAGS: "-j2"
        run: |
          # Purge broken NDK cache if present
          rm -rf ~/.buildozer/android/platform/android-ndk-r28c
          rm -rf ~/.buildozer/android/platform/build-*

          # Run buildozer debug build
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
