name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            ccache \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            ninja-build

      - name: Install Buildozer & Core Python Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "Cython==0.29.36" "sh" "buildozer>=1.5.0" "python-for-android>=2024.1.21"

      - name: Pre-configure Android SDK Tools
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $SDK_DIR/cmdline-tools
          
          mkdir -p $SDK_DIR/cmdline-tools/latest
          mv $SDK_DIR/cmdline-tools/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/ 2>/dev/null || true
          
          mkdir -p $SDK_DIR/tools
          ln -s $SDK_DIR/cmdline-tools/latest/bin $SDK_DIR/tools/bin

          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Output Detailed Error Log
        if: failure()
        run: |
          echo "=== BUILDOZER LOG START ==="
          if [ -f ~/.buildozer/buildozer.log ]; then
            cat ~/.buildozer/buildozer.log | tail -n 200
          fi
          echo "=== BUILDOZER LOG END ==="

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
