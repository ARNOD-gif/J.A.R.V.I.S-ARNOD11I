name: Build J.A.R.V.I.S APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            build-essential \
            git \
            ffmpeg \
            libgstreamer1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libssl-dev \
            python3-dev \
            ccache \
            zip \
            unzip \
            openjdk-17-jdk

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33
          pip install git+https://github.com/kivy/buildozer.git

      - name: Convert ICO to PNG
        run: convert config/jarvis.ico[0] config/icon.png

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
