- name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "24333f8a63717244199ba79615a32b02562525b0\n84831b9409646a2b8f22a21725d6767949306307\n7855a97397692e4f05e50529f04137e42d7b7d35" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a2b8f22a21725d6767949306307" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug
