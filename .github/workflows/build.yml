name: Build J.A.R.V.I.S APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK using Official Buildozer Docker Image
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/user/hostpython" \
            kivy/buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
