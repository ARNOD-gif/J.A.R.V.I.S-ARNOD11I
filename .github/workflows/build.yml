name: Build J.A.R.V.I.S APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache libncursesw5-dev

      - name: Install Cython & Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.33 "buildozer>=1.5.0"

      - name: Configure SDK Layout
        run: |
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK"
          ln -sf $ANDROID_HOME/* "$BUILDOZER_SDK/" || true

          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

          mkdir -p "$BUILDOZER_SDK/tools/bin"
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$BUILDOZER_SDK/tools/bin/sdkmanager" || true

      - name: Build APK with Buildozer
        env:
          MAKEFLAGS: "-j2"
          # Unset system-level NDK overrides so Buildozer controls the version
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
        run: |
          # Clean out incompatible NDK builds
          rm -rf ~/.buildozer/android/platform/android-ndk-r*
          rm -rf ~/.buildozer/android/platform/build-*

          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
